# Application Name
spring.application.name=sems-backend

# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration (Aiven)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/sems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Sql@3306}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SSL Configuration for Aiven
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:sems-secret-key-for-jwt-token-generation-2024-must-be-at-least-64-bytes-long-for-hs512-algorithm}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Bean Overriding
spring.main.allow-bean-definition-overriding=true
