services:
  # Backend Service
  - type: web
    name: sems-backend
    env: docker
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        value: jdbc:mysql://mysql-2d367cc8-shwetham3101-project.a.aivencloud.com:15508/SEMS_APP_DATABASE?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: DATABASE_USERNAME
        value: avnadmin
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
        length: 64
      - key: CORS_ALLOWED_ORIGINS
        value: https://sems-frontend.onrender.com,https://sems-frontend.onrender.com/

  # Frontend Service
  - type: web
    name: sems-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: REACT_APP_API_URL
        value: https://sems-app-0y62.onrender.com/api
